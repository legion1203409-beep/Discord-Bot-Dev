openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Server healthy and bot connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: Server running but bot is offline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /moderation/session:
    get:
      operationId: moderationSession
      tags: [moderation]
      responses:
        "200":
          description: Current moderation web session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModerationSession" }
  /moderation/login:
    post:
      operationId: moderationLogin
      tags: [moderation]
      deprecated: true
      responses:
        "410": { description: Code login removed; use Discord OAuth2 }
  /moderation/auth-config:
    get:
      operationId: moderationAuthConfig
      tags: [moderation]
      responses:
        "200":
          description: Public login availability; never includes credentials
          content: { application/json: { schema: { $ref: "#/components/schemas/ModerationAuthConfig" } } }
  /moderation/oauth/discord:
    get:
      operationId: moderationDiscordAuthorize
      tags: [moderation]
      responses:
        "302": { description: Redirects to Discord with browser-bound OAuth state }
        "503": { description: Discord OAuth is not configured }
  /moderation/oauth/discord/callback:
    get:
      operationId: moderationDiscordCallback
      tags: [moderation]
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        "302": { description: Redirects to moderation after session creation or with a safe login error }
  /moderation/logout:
    post:
      operationId: moderationLogout
      tags: [moderation]
      responses: { "204": { description: Session revoked } }
  /moderation/public/server-profile:
    get:
      operationId: getPublicServerProfile
      tags: [moderation]
      responses:
        "200":
          description: Public Discord server identity and invitation
          content: { application/json: { schema: { $ref: "#/components/schemas/PublicServerProfile" } } }
  /moderation/verification/recruitment:
    get:
      operationId: getRecruitmentDashboard
      tags: [moderation]
      parameters:
        - { name: guildId, in: query, required: true, schema: { type: string, pattern: "^\\d{5,25}$" } }
      responses:
        "200":
          description: Public recruiter leaderboard and the signed-in member's private referral summary, if verified
          content: { application/json: { schema: { $ref: "#/components/schemas/RecruitmentDashboard" } } }
        "400": { description: Invalid guild ID }
  /moderation/verification/complete:
    post:
      operationId: completeWebsiteVerification
      tags: [moderation]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/VerificationLinkCompletionInput" } } }
      responses:
        "200":
          description: One-time Discord-issued link accepted and the member verified
          content: { application/json: { schema: { $ref: "#/components/schemas/VerificationLinkCompletionResponse" } } }
        "400": { description: "Invalid, expired, reused link or incomplete slider challenge" }
        "503": { description: Discord verification service is unavailable }
  /moderation/verification/status:
    get:
      operationId: getVerificationStatus
      tags: [moderation]
      parameters:
        - { name: guildId, in: query, required: false, schema: { type: string, pattern: "^\\d{5,25}$" } }
      responses:
        "200":
          description: Whether the current browser's verification cookie is valid for the requested server
          content: { application/json: { schema: { $ref: "#/components/schemas/VerificationStatusResponse" } } }
  /moderation/guilds/{guildId}/verification/members:
    parameters: [{ name: guildId, in: path, required: true, schema: { type: string, pattern: "^\\d{5,25}$" } }]
    get:
      operationId: getVerificationMembers
      tags: [moderation]
      responses:
        "200":
          description: Guild member verification status for authorized moderators
          content: { application/json: { schema: { $ref: "#/components/schemas/VerificationMembersResponse" } } }
        "401": { description: Moderation session is required }
        "403": { description: Guild configuration access is required }
        "503": { description: Discord member list is unavailable }
  /moderation/guilds/{guildId}/verification/members/{userId}/verify:
    parameters:
      - { name: guildId, in: path, required: true, schema: { type: string, pattern: "^\\d{5,25}$" } }
      - { name: userId, in: path, required: true, schema: { type: string, pattern: "^\\d{5,25}$" } }
    post:
      operationId: manuallyVerifyGuildMember
      tags: [moderation]
      responses:
        "200":
          description: Member manually verified by an authorized moderator
          content: { application/json: { schema: { $ref: "#/components/schemas/ManualVerificationResponse" } } }
        "400": { description: Invalid verification setup or member }
        "401": { description: Moderation session is required }
        "403": { description: Guild configuration access is required }
        "503": { description: Discord verification service is unavailable }
  /moderation/storage/uploads/request-url:
    post:
      operationId: requestModerationStorageUploadUrl
      tags: [moderation]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ModerationStorageUploadRequest" } } }
      responses:
        "200":
          description: Owner-authorized temporary upload URL and object path
          content: { application/json: { schema: { $ref: "#/components/schemas/ModerationStorageUploadResponse" } } }
        "400": { description: Invalid image metadata }
        "401": { description: Moderation session is required }
        "403": { description: Guild ownership is required }
  /moderation/guilds/{guildId}/config:
    parameters: [{ name: guildId, in: path, required: true, schema: { type: string } }]
    get:
      operationId: moderationGetConfig
      tags: [moderation]
      responses:
        "200":
          description: Guild moderation configuration and revision
          content: { application/json: { schema: { $ref: "#/components/schemas/ModerationConfigResponse" } } }
    put:
      operationId: moderationPutConfig
      tags: [moderation]
      parameters: [{ name: If-Match, in: header, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ModerationConfig" } } }
      responses:
        "200":
          description: Saved configuration
          content: { application/json: { schema: { $ref: "#/components/schemas/ModerationConfigResponse" } } }
        "409": { description: Stale configuration revision }
  /moderation/guilds/{guildId}/config/channels:
    parameters: [{ name: guildId, in: path, required: true, schema: { type: string } }]
    post:
      operationId: moderationProvisionConfigChannel
      tags: [moderation]
      parameters: [{ name: If-Match, in: header, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ModerationChannelInput" } } }
      responses:
        "200":
          description: Existing Discord channel reused and configuration saved
          content: { application/json: { schema: { $ref: "#/components/schemas/ModerationChannelResponse" } } }
        "201":
          description: Discord channel created and configuration saved
          content: { application/json: { schema: { $ref: "#/components/schemas/ModerationChannelResponse" } } }
        "400": { description: "Invalid destination, role configuration, or Discord channel" }
        "401": { description: Moderation session is required }
        "403": { description: "Guild configuration access or required Discord permissions are missing" }
        "409": { description: Stale configuration revision }
        "428": { description: If-Match configuration revision is required }
  /moderation/guilds/{guildId}/bot-control:
    parameters: [{ name: guildId, in: path, required: true, schema: { type: string } }]
    get:
      operationId: moderationGetBotControl
      tags: [moderation]
      responses:
        "200":
          description: Current bot-control settings
          content: { application/json: { schema: { $ref: "#/components/schemas/BotControlResponse" } } }
        "401": { description: Moderation session is required }
        "403": { description: Guild configuration access is required }
    put:
      operationId: moderationPutBotControl
      tags: [moderation]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/BotControlSettings" } } }
      responses:
        "200":
          description: Bot-control settings saved
          content: { application/json: { schema: { $ref: "#/components/schemas/BotControlResponse" } } }
        "207":
          description: Some settings were applied before a later write failed; verification details are present only when its panel was published
          content: { application/json: { schema: { $ref: "#/components/schemas/BotControlPartialApplyResponse" } } }
        "400": { description: Invalid settings or Discord target }
        "401": { description: Moderation session is required }
        "403": { description: Guild configuration access is required or the bot cannot post to a configured channel }
        "503": { description: Required Discord service is unavailable }
  /moderation/guilds/{guildId}/server-setup:
    parameters: [{ name: guildId, in: path, required: true, schema: { type: string } }]
    get:
      operationId: moderationGetServerSetup
      tags: [moderation]
      responses:
        "200":
          description: Editable template; no Discord changes
          content:
            application/json:
              schema:
                type: object
                required: [draft, aiAvailable]
                properties:
                  draft: { $ref: "#/components/schemas/ServerSetupDraft" }
                  aiAvailable: { type: boolean }
        "403": { description: Guild owner access required }
  /moderation/guilds/{guildId}/server-setup/draft:
    parameters: [{ name: guildId, in: path, required: true, schema: { type: string } }]
    get:
      operationId: moderationGetSavedServerSetupDraft
      tags: [moderation]
      responses:
        "200":
          description: Draft saved by the authenticated operator for this server, or null
          content:
            application/json:
              schema:
                type: object
                required: [savedDraft]
                properties:
                  savedDraft:
                    oneOf:
                      - $ref: "#/components/schemas/ServerSetupDraftRecord"
                      - type: "null"
        "401": { description: Moderation session is required }
        "403": { description: Guild configuration access is required }
    put:
      operationId: moderationSaveServerSetupDraft
      tags: [moderation]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServerSetupDraftSaveInput" }
      responses:
        "200":
          description: Draft saved with the next revision
          content:
            application/json:
              schema:
                type: object
                required: [savedDraft]
                properties:
                  savedDraft: { $ref: "#/components/schemas/ServerSetupDraftRecord" }
        "400": { description: Invalid draft or expected revision }
        "401": { description: Moderation session is required }
        "403": { description: Guild configuration access or CSRF token is required }
        "409": { description: Another session saved a newer revision }
  /moderation/guilds/{guildId}/server-setup/suggest:
    parameters: [{ name: guildId, in: path, required: true, schema: { type: string } }]
    post:
      operationId: moderationSuggestServerSetup
      tags: [moderation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [communityType, goals]
              properties:
                communityType: { type: string, minLength: 1, maxLength: 300 }
                goals: { type: string, minLength: 1, maxLength: 1500 }
                refinement: { type: string, maxLength: 1500 }
                draft: { $ref: "#/components/schemas/ServerSetupDraft" }
      responses:
        "200":
          description: Validated AI suggestion only
          content:
            application/json:
              schema:
                type: object
                required: [draft]
                properties:
                  draft: { $ref: "#/components/schemas/ServerSetupDraft" }
        "400": { description: Invalid input }
        "403": { description: Owner access and CSRF token required }
        "503": { description: AI unavailable or invalid model response }
  /moderation/guilds/{guildId}/server-setup/preview:
    parameters: [{ name: guildId, in: path, required: true, schema: { type: string } }]
    post:
      operationId: moderationPreviewServerSetup
      tags: [moderation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [draft]
              properties:
                draft: { $ref: "#/components/schemas/ServerSetupDraft" }
      responses:
        "200":
          description: Fresh Discord checks and fingerprint for confirmation
          content:
            application/json:
              schema:
                type: object
                required: [ready, issues, items, fingerprint]
                properties:
                  ready: { type: boolean }
                  issues: { type: array, items: { type: string } }
                  fingerprint: { type: string }
                  items: { type: array, items: { $ref: "#/components/schemas/ServerSetupPreviewItem" } }
        "400": { description: Invalid draft }
        "403": { description: Owner access and CSRF token required }
        "409": { description: Concurrent operation or unavailable checks }
        "503": { description: Bot unavailable }
  /moderation/guilds/{guildId}/server-setup/apply:
    parameters: [{ name: guildId, in: path, required: true, schema: { type: string } }]
    post:
      operationId: moderationApplyServerSetup
      tags: [moderation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [draft, confirmed, fingerprint]
              properties:
                draft: { $ref: "#/components/schemas/ServerSetupDraft" }
                confirmed: { type: boolean, enum: [true] }
                fingerprint: { type: string, pattern: "^[a-f0-9]{64}$" }
      responses:
        "200":
          description: Per-resource outcome, including partial failure
          content:
            application/json:
              schema:
                type: object
                required: [complete, items]
                properties:
                  complete: { type: boolean }
                  items: { type: array, items: { $ref: "#/components/schemas/ServerSetupApplyItem" } }
        "400": { description: Invalid draft or missing confirmation }
        "403": { description: Owner access and CSRF token required }
        "409": { description: "Stale preview, conflict, or concurrent operation" }
        "503": { description: Bot unavailable }
  /moderation/guilds/{guildId}/activity-ranks:
    parameters: [{ name: guildId, in: path, required: true, schema: { type: string, minLength: 5, maxLength: 25 } }]
    get:
      operationId: moderationGetActivityRanks
      tags: [moderation]
      responses:
        "200":
          description: Guild-scoped activity rank settings
          content: { application/json: { schema: { $ref: "#/components/schemas/ActivityRankSettingsResponse" } } }
        "401": { description: Moderation session is required }
        "403": { description: Guild configuration access is required }
    put:
      operationId: moderationPutActivityRanks
      tags: [moderation]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ActivityRankSettings" } } }
      responses:
        "200":
          description: Activity rank settings saved
          content: { application/json: { schema: { $ref: "#/components/schemas/ActivityRankSettingsResponse" } } }
        "400": { description: Invalid settings or notification channel }
        "401": { description: Moderation session is required }
        "403": { description: Guild configuration access is required }
  /moderation/guilds/{guildId}/channels/{channelId}/bot-access:
    parameters:
      - { name: guildId, in: path, required: true, schema: { type: string, minLength: 5, maxLength: 25 } }
      - { name: channelId, in: path, required: true, schema: { type: string, minLength: 5, maxLength: 25 } }
    get:
      operationId: moderationGetActivityRankChannelBotAccess
      tags: [moderation]
      responses:
        "200":
          description: Current bot access to the selected activity-rank announcement channel
          content: { application/json: { schema: { $ref: "#/components/schemas/ActivityRankChannelBotAccess" } } }
        "401": { description: Moderation session is required }
        "403": { description: Guild configuration access is required }
        "404": { description: The selected text channel is unavailable in this guild }
        "503": { description: Discord bot is unavailable }
    put:
      operationId: moderationSetActivityRankChannelBotAccess
      tags: [moderation]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ActivityRankChannelBotAccessInput" } } }
      responses:
        "200":
          description: Bot access was updated for the selected channel
          content: { application/json: { schema: { $ref: "#/components/schemas/ActivityRankChannelBotAccess" } } }
        "400": { description: Invalid channel access settings or channel }
        "401": { description: Moderation session is required }
        "403": { description: Guild configuration access is required or the bot lacks Manage Channels }
        "404": { description: The selected text channel is unavailable in this guild }
        "503": { description: Discord bot is unavailable }
  /moderation/storage/activity-ranks/uploads/request-url:
    post:
      operationId: requestActivityRankBannerUploadUrl
      tags: [moderation]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ModerationStorageUploadRequest" } } }
      responses:
        "200":
          description: Guild-config-authorized temporary upload URL and object path
          content: { application/json: { schema: { $ref: "#/components/schemas/ModerationStorageUploadResponse" } } }
        "400": { description: Invalid image metadata }
        "401": { description: Moderation session is required }
        "403": { description: Guild configuration access is required }
  /moderation/guilds/{guildId}/bot-control/verification-panel:
    parameters: [{ name: guildId, in: path, required: true, schema: { type: string, minLength: 5, maxLength: 25 } }]
    post:
      operationId: moderationPublishVerificationPanel
      tags: [moderation]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/VerificationPanelPublishInput" } } }
      responses:
        "200":
          description: Verification panel published or updated and its configuration saved
          content: { application/json: { schema: { $ref: "#/components/schemas/VerificationPanelPublishResponse" } } }
        "207":
          description: The panel was published but its configuration could not be persisted
          content: { application/json: { schema: { $ref: "#/components/schemas/BotControlPartialApplyResponse" } } }
        "400": { description: "Verification is disabled or its channel, role, or settings are invalid" }
        "401": { description: Moderation session is required }
        "403": { description: Guild configuration access is required }
        "503": { description: Discord service is unavailable }
  /moderation/guilds/{guildId}/protection-toggle:
    parameters: [{ name: guildId, in: path, required: true, schema: { type: string } }]
    put:
      operationId: moderationProtectionToggle
      tags: [moderation]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProtectionToggleInput" } } }
      responses:
        "200":
          description: Updated module setting, Discord announcement, and native AutoMod synchronization status
          content: { application/json: { schema: { $ref: "#/components/schemas/ModerationConfigResponse" } } }
        "401": { description: Moderation session is required }
        "403": { description: Guild configuration access is required }
        "400": { description: Invalid toggle }
  /moderation/guilds/{guildId}/logs:
    parameters: [{ name: guildId, in: path, required: true, schema: { type: string } }]
    get:
      operationId: moderationLogs
      tags: [moderation]
      responses:
        "200":
          description: Staff-facing enforcement logs (not owner audit)
          content: { application/json: { schema: { $ref: "#/components/schemas/ModerationLogPage" } } }
  /moderation/guilds/{guildId}/logs/audit:
    parameters: [{ name: guildId, in: path, required: true, schema: { type: string } }]
    get:
      operationId: moderationAuditLogs
      tags: [moderation]
      responses:
        "200":
          description: Owner/settings-admin audit trail
          content: { application/json: { schema: { $ref: "#/components/schemas/ModerationLogPage" } } }
  /moderation/guilds/{guildId}/actions:
    parameters: [{ name: guildId, in: path, required: true, schema: { type: string } }]
    post:
      operationId: moderationExecuteAction
      tags: [moderation]
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 16, maxLength: 128 } }
        - { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModerationCommandInput" }
      responses:
        "201":
          description: Discord command executed
          content: { application/json: { schema: { $ref: "#/components/schemas/ModerationCommandResult" } } }
        "200":
          description: Previously completed command (not repeated)
          content: { application/json: { schema: { $ref: "#/components/schemas/ModerationCommandResult" } } }
        "400": { description: Missing or invalid command arguments }
        "403": { description: Discord permissions or server policy deny the command }
        "409": { description: Pending or uncertain command must not be repeated }
components:
  schemas:
    ServerSetupRole:
      type: object
      additionalProperties: false
      required: [key, name]
      properties:
        key: { type: string, pattern: "^[a-z][a-z0-9_-]{0,39}$" }
        name: { type: string, minLength: 1, maxLength: 100 }
    ServerSetupChannel:
      type: object
      additionalProperties: false
      required: [key, name, readers, writers, explanation]
      properties:
        key: { type: string, pattern: "^[a-z][a-z0-9_-]{0,39}$" }
        name: { type: string, pattern: "^[a-z0-9][a-z0-9_-]{0,79}$" }
        readers: { type: array, maxItems: 21, items: { type: string } }
        writers: { type: array, maxItems: 21, items: { type: string } }
        explanation: { type: string, maxLength: 400 }
    ServerSetupDraft:
      type: object
      additionalProperties: false
      required: [roles, categories]
      properties:
        roles: { type: array, maxItems: 20, items: { $ref: "#/components/schemas/ServerSetupRole" } }
        categories:
          type: array
          maxItems: 10
          items:
            type: object
            additionalProperties: false
            required: [key, name, channels]
            properties:
              key: { type: string, pattern: "^[a-z][a-z0-9_-]{0,39}$" }
              name: { type: string, minLength: 1, maxLength: 100 }
              channels: { type: array, maxItems: 30, items: { $ref: "#/components/schemas/ServerSetupChannel" } }
    ServerSetupDraftSaveInput:
      type: object
      additionalProperties: false
      required: [draft, expectedRevision]
      properties:
        draft: { $ref: "#/components/schemas/ServerSetupDraft" }
        expectedRevision: { type: integer, minimum: 0 }
    ServerSetupDraftRecord:
      type: object
      additionalProperties: false
      required: [draft, revision, updatedAt]
      properties:
        draft: { $ref: "#/components/schemas/ServerSetupDraft" }
        revision: { type: integer, minimum: 1 }
        updatedAt: { type: string, format: date-time }
    ServerSetupPreviewItem:
      type: object
      required: [key, name, kind, status, detail]
      properties:
        key: { type: string }
        name: { type: string }
        kind: { type: string, enum: [role, category, channel] }
        status: { type: string, enum: [create, reuse, conflict] }
        detail: { type: string }
        id: { type: string }
        parentKey: { type: string }
    ServerSetupApplyItem:
      type: object
      required: [key, name, kind, status, detail]
      properties:
        key: { type: string }
        name: { type: string }
        kind: { type: string, enum: [role, category, channel] }
        status: { type: string, enum: [created, reused, failed] }
        detail: { type: string }
        parentKey: { type: string }
    ModerationAuthConfig:
      type: object
      required: [discordOAuthConfigured, authorizationUrl, botInviteUrl]
      properties:
        discordOAuthConfigured: { type: boolean }
        authorizationUrl: { type: string }
        botInviteUrl: { type: ["string", "null"], format: uri, description: Public Discord bot invitation URL; null when the application ID is unavailable. }
    ModerationCommandInput:
      type: object
      required: [type]
      description: Member commands require targetId; channel commands require channelId. Mute requires durationMinutes, nick requires nickname, role requires roleId. Purge requires amount 1–100; slowmode requires amount 0–21600 seconds (0 disables).
      properties:
        type: { type: string, enum: [warn, mute, kick, ban, unmute, purge, slowmode, lock, unlock, nick, role] }
        targetId: { type: string, pattern: "^\\d{5,25}$" }
        channelId: { type: string, pattern: "^\\d{5,25}$" }
        roleId: { type: string, pattern: "^\\d{5,25}$" }
        reason: { type: string, minLength: 1, maxLength: 500 }
        durationMinutes: { type: integer, minimum: 1, maximum: 40320 }
        amount: { type: integer, minimum: 0, maximum: 21600 }
        nickname: { type: string, minLength: 1, maxLength: 32 }
    ModerationCommandResult:
      type: object
      properties:
        actionId: { type: string }
        caseId: { type: string }
        summary: { type: string }
    ModerationSession:
      type: object
      required: [authenticated]
      properties:
        authenticated: { type: boolean }
        userId: { type: string }
        csrfToken: { type: string }
        expiresAt: { type: string, format: date-time }
        guilds:
          type: array
          items:
            type: object
            required: [id, name, access]
            properties:
              id: { type: string }
              name: { type: string }
              access: { type: string, enum: [staff, manager, administrator, owner] }
    ModerationConfig:
      type: object
      additionalProperties: true
      description: Validated by the server's ModerationConfigSchema; use GET response config as the write body.
    ModerationChannelInput:
      type: object
      additionalProperties: false
      required: [destination]
      properties:
        destination:
          type: string
          enum:
            - activityLog.messages
            - activityLog.members
            - activityLog.channels
            - activityLog.roles
            - activityLog.voice
            - activityLog.moderation
            - activityLog.security
            - autoMod.logChannelId
            - antiFlood.logChannelId
            - antiRaid.alertChannelId
            - antiSpam.logChannelId
            - suspiciousBehavior.alertChannelId
            - ai.logChannelId
            - audit.channelId
    ModerationChannelResponse:
      type: object
      additionalProperties: false
      required: [config, version, destination, channel, created]
      properties:
        config: { $ref: "#/components/schemas/ModerationConfig" }
        version: { type: integer }
        destination: { type: string }
        channel:
          type: object
          additionalProperties: false
          required: [key, id, name, type]
          properties:
            key: { type: string }
            id: { type: string }
            name: { type: string }
            type: { type: string, enum: [text] }
        created: { type: boolean }
    ProtectionToggleInput:
      type: object
      additionalProperties: false
      required: [key, enabled]
      properties:
        key:
          type: string
          enum: [protection, autoMod, wordFilter, linkBlock, antiRaid, antiSpam, antiFlood, suspiciousBehavior, ai, manualTools, cases, audit, escalation, embeds]
        enabled: { type: boolean }
    BotControlSettings:
      type: object
      additionalProperties: true
      description: Bot-control write payload. Nested settings are validated by the API; use the GET response as the round-trip payload.
      properties:
        inviteTracking:
          type: object
          additionalProperties: true
          properties:
            recruitment:
              $ref: "#/components/schemas/InviteRecruitmentSettings"
    VerificationPanelPublishInput:
      type: object
      additionalProperties: false
      required: [enabled, channelId, roleId, title, message, buttonLabel, buttonEmoji, successMessage, alreadyVerifiedMessage, imageUrl, panelMessageId]
      properties:
        enabled: { type: boolean, const: true }
        channelId: { type: string, pattern: "^\\d{5,25}$" }
        roleId: { type: string, pattern: "^\\d{5,25}$" }
        title: { type: string, minLength: 1, maxLength: 256 }
        message: { type: string, minLength: 1, maxLength: 4000 }
        buttonLabel: { type: string, minLength: 1, maxLength: 80 }
        buttonEmoji: { type: string, maxLength: 100 }
        successMessage: { type: string, minLength: 1, maxLength: 2000 }
        alreadyVerifiedMessage: { type: string, minLength: 1, maxLength: 2000 }
        imageUrl: { type: string, maxLength: 2000 }
        thumbnailUrl: { type: string, maxLength: 2000, default: "" }
        panelMessageId: { type: string, pattern: "^(?:\\d{5,25})?$" }
    VerificationPanelPublishResponse:
      type: object
      additionalProperties: false
      required: [verification]
      properties:
        verification:
          type: object
          additionalProperties: true
          description: Saved verification settings with the published Discord panel message ID.
    BotControlResponse:
      type: object
      additionalProperties: true
      description: Bot-control settings returned by GET or after a successful PUT.
    RecruitmentInvitee:
      type: object
      additionalProperties: false
      required: [displayName, verifiedAt]
      properties:
        displayName: { type: string }
        verifiedAt: { type: string, format: date-time }
    InviteRecruitmentMilestoneSettings:
      type: object
      additionalProperties: false
      required: [requiredInvites, roleId]
      properties:
        requiredInvites: { type: integer, minimum: 1, maximum: 100000 }
        roleId: { type: string, pattern: "^(?:\\d{5,25})?$" }
    InviteRecruitmentSettings:
      type: object
      additionalProperties: false
      required: [enabled, inviteChannelId, maxUses, maxAgeDays, dailyInviteLimit, verificationHours, rewardPoints, milestones]
      properties:
        enabled: { type: boolean }
        inviteChannelId: { type: string, pattern: "^(?:\\d{5,25})?$" }
        maxUses: { type: integer, minimum: 1, maximum: 100 }
        maxAgeDays: { type: integer, minimum: 1, maximum: 30 }
        dailyInviteLimit: { type: integer, minimum: 1, maximum: 20 }
        verificationHours: { type: integer, minimum: 1, maximum: 72 }
        rewardPoints: { type: integer, minimum: 1, maximum: 100000 }
        milestones:
          type: array
          minItems: 3
          maxItems: 3
          items: { $ref: "#/components/schemas/InviteRecruitmentMilestoneSettings" }
    PublicServerProfile:
      type: object
      additionalProperties: false
      required: [name, iconUrl, inviteUrl, guildId]
      properties:
        name: { type: string }
        iconUrl: { type: ["string", "null"], format: uri }
        inviteUrl: { type: string, format: uri }
        guildId: { type: ["string", "null"], pattern: "^\\d{5,25}$" }
    RecruitmentLeaderboardEntry:
      type: object
      additionalProperties: false
      required: [rank, displayName, verifiedInviteCount, points]
      properties:
        rank: { type: integer, minimum: 1 }
        displayName: { type: string }
        verifiedInviteCount: { type: integer, minimum: 0 }
        points: { type: integer, minimum: 0 }
    RecruitmentViewer:
      type: object
      additionalProperties: false
      required: [displayName, createdInviteCount, verifiedInviteCount, points, invitees]
      properties:
        displayName: { type: string }
        createdInviteCount: { type: integer, minimum: 0 }
        verifiedInviteCount: { type: integer, minimum: 0 }
        points: { type: integer, minimum: 0 }
        invitees:
          type: array
          items: { $ref: "#/components/schemas/RecruitmentInvitee" }
    RecruitmentDashboard:
      type: object
      additionalProperties: false
      required: [guildId, guildName, enabled, viewer, leaderboard]
      properties:
        guildId: { type: string }
        guildName: { type: [string, "null"] }
        enabled: { type: boolean }
        viewer:
          anyOf:
            - $ref: "#/components/schemas/RecruitmentViewer"
            - type: "null"
        leaderboard:
          type: array
          items: { $ref: "#/components/schemas/RecruitmentLeaderboardEntry" }
    VerificationLinkCompletionInput:
      type: object
      additionalProperties: false
      required: [ticket, sliderCompleted]
      properties:
        ticket: { type: string, minLength: 40, maxLength: 128 }
        sliderCompleted: { type: boolean }
    VerificationLinkCompletionResponse:
      type: object
      additionalProperties: false
      required: [verified, result, guildId]
      properties:
        verified: { type: boolean }
        result: { type: string, enum: [verified, already_verified] }
        guildId: { type: string }
    VerificationStatusResponse:
      type: object
      additionalProperties: false
      required: [verified]
      properties:
        verified: { type: boolean }
        reason: { type: string, enum: [bot_offline] }
        guildId: { type: string, pattern: "^\\d{5,25}$" }
    VerificationMember:
      type: object
      additionalProperties: false
      required: [id, username, displayName, avatarUrl, joinedAt, verified]
      properties:
        id: { type: string }
        username: { type: string }
        displayName: { type: string }
        avatarUrl: { type: string }
        joinedAt: { type: [string, "null"], format: date-time }
        verified: { type: boolean }
    VerificationMembersResponse:
      type: object
      additionalProperties: false
      required: [guildId, roleId, roleName, total, verifiedTotal, unverifiedTotal, members]
      properties:
        guildId: { type: string }
        roleId: { type: string }
        roleName: { type: [string, "null"] }
        total: { type: integer, minimum: 0 }
        verifiedTotal: { type: integer, minimum: 0 }
        unverifiedTotal: { type: integer, minimum: 0 }
        members:
          type: array
          items: { $ref: "#/components/schemas/VerificationMember" }
    ManualVerificationResponse:
      type: object
      additionalProperties: false
      required: [userId, displayName, result]
      properties:
        userId: { type: string }
        displayName: { type: string }
        result: { type: string, enum: [verified, already_verified] }
    ActivityRankSettings:
      type: object
      additionalProperties: false
      required: [enabled, notificationChannelId, rankUpMessage, bannerImageUrl, color]
      properties:
        enabled: { type: boolean }
        notificationChannelId: { type: string, pattern: "^(?:\\d{5,25})?$" }
        rankUpMessage: { type: string, maxLength: 1800 }
        bannerImageUrl:
          type: string
          maxLength: 2000
          description: Empty, an app-upload object path, or an HTTPS image URL from cdn.discordapp.com, media.discordapp.net, i.imgur.com or images.unsplash.com. External redirects are not followed.
        barStyle: { type: string, enum: [discord, dungi, gradient, oblic, pixel, pro, sword], default: discord }
        color: { type: string, pattern: "^#[0-9a-fA-F]{6}$" }
        layout:
          type: [object, "null"]
          additionalProperties: false
          required: [bar, member]
          properties:
            bar: { $ref: "#/components/schemas/ActivityRankBarLayout" }
            member: { $ref: "#/components/schemas/ActivityRankMemberLayout" }
          description: Optional banner-relative placement and size overrides for the animated XP bar and member identity card. Null preserves automatic placement.
        roleRewards:
          type: [array, "null"]
          description: Null uses automatic legacy roles. An explicit array uses only existing selected roles; an empty array disables role rewards. Levels and role IDs must each be unique.
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [level, roleId]
            properties:
              level: { type: integer, minimum: 1, maximum: 100 }
              roleId: { type: string, pattern: "^\\d{5,25}$" }
    ActivityRankBarLayout:
      type: object
      additionalProperties: false
      required: [x, y, width]
      properties:
        x: { type: number, minimum: 0, maximum: 100, description: Left edge as a percentage of banner width. }
        y: { type: number, minimum: 0, maximum: 100, description: Top edge as a percentage of banner height. }
        width: { type: number, minimum: 30, maximum: 100, description: Width and proportional size as a percentage of banner width. }
    ActivityRankMemberLayout:
      type: object
      additionalProperties: false
      required: [x, y, width]
      properties:
        x: { type: number, minimum: 0, maximum: 100, description: Left edge as a percentage of banner width. }
        y: { type: number, minimum: 0, maximum: 100, description: Top edge as a percentage of banner height. }
        width: { type: number, minimum: 40, maximum: 100, description: Width and proportional size as a percentage of banner width. }
    ActivityRankSettingsResponse:
      type: object
      additionalProperties: false
      required: [config]
      properties:
        config: { $ref: "#/components/schemas/ActivityRankSettings" }
    ActivityRankChannelBotAccessInput:
      type: object
      additionalProperties: false
      required: [viewChannel, sendMessages]
      properties:
        viewChannel: { type: boolean }
        sendMessages: { type: boolean }
    ActivityRankChannelBotAccess:
      type: object
      additionalProperties: false
      required: [channelId, channelName, canManageChannels, viewChannel, sendMessages]
      properties:
        channelId: { type: string, pattern: "^\\d{5,25}$" }
        channelName: { type: string }
        canManageChannels: { type: boolean }
        viewChannel: { type: boolean }
        sendMessages: { type: boolean }
    BotControlPartialApplyResponse:
      type: object
      additionalProperties: false
      required: [partialApply, verificationPanelPublished, message]
      properties:
        partialApply: { type: boolean, const: true }
        verificationPanelPublished: { type: boolean }
        verification:
          type: object
          additionalProperties: true
          description: Published verification settings, included only when the verification panel was published; retains panelMessageId when available.
        message: { type: string }
    ModerationStorageUploadRequest:
      type: object
      additionalProperties: false
      required: [guildId, name, size, contentType]
      properties:
        guildId: { type: string, minLength: 5, maxLength: 25 }
        name: { type: string, minLength: 1, maxLength: 200 }
        size: { type: integer, minimum: 1, maximum: 10485760 }
        contentType: { type: string, pattern: "^image/(jpeg|png|gif|webp)$" }
    ModerationStorageUploadResponse:
      type: object
      required: [uploadURL, objectPath, metadata]
      properties:
        uploadURL: { type: string, format: uri }
        objectPath: { type: string }
        metadata: { $ref: "#/components/schemas/ModerationStorageUploadRequest" }
    ModerationConfigResponse:
      type: object
      required: [config, version]
      properties:
        config: { $ref: "#/components/schemas/ModerationConfig" }
        version: { type: integer }
        updatedAt: { type: string, format: date-time, nullable: true }
        nativeAutoMod:
          type: object
          required: [status]
          properties:
            status: { type: string, enum: [synced, bot_offline, missing_permission, conflict, failed] }
        notification:
          type: object
          required: [status, modules]
          properties:
            status: { type: string, enum: [not_applicable, sent, no_channel, bot_offline, guild_unavailable, channel_unavailable, send_failed] }
            modules:
              type: array
              items: { type: string }
    ModerationLog:
      type: object
      required: [id, guildId, eventType, detail, createdAt]
      properties:
        id: { type: string, format: uuid }
        guildId: { type: string }
        actorId: { type: string, nullable: true }
        eventType: { type: string }
        targetType: { type: string, nullable: true }
        targetId: { type: string, nullable: true }
        detail: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
    ModerationLogPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ModerationLog" } }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
        botOnline:
          type: boolean
        uptime:
          type: number
        botReadyAt:
          type: string
          nullable: true
          description: ISO timestamp of when the bot last became ready/reconnected (null if never connected)
        botUptime:
          type: number
          description: Seconds since the bot last became ready (0 if never connected or currently offline)
        shardStatus:
          type: string
          nullable: true
          description: Current shard connection state
        oracleReplyMode:
          type: string
          enum: [full, degraded]
          description: >-
            "full" when the Oracle answers every reply (MessageContent intent
            active); "degraded" when it only answers @mentions and ping-on
            replies.
        oracleReplyReason:
          type: string
          enum: [active, disabled, portal_toggle_missing]
          description: >-
            Why the Oracle is in its current reply mode. "active": full mode
            running. "disabled": MessageContent feature not enabled by the
            operator. "portal_toggle_missing": feature enabled but Discord
            rejected the privileged intent (code 4014) so the bot fell back.
        alertsConfigured:
          type: boolean
          description: >-
            Whether DISCORD_ALERT_WEBHOOK_URL is set. When false, outage and
            recovery push alerts are silently suppressed — operators will NOT
            be notified of disconnects.
        alertThresholdMs:
          type: number
          description: >-
            Grace period in milliseconds before a transient disconnect escalates
            to an outage alert (DISCONNECT_ALERT_THRESHOLD_MS, default 300000).
        justiceWindowMinutes:
          type: number
          description: >-
            How far back (in minutes) the justice scan looks for toxic messages.
            Reflects the active ORACLE_JUSTICE_WINDOW_MINUTES value (default 30,
            max 1440). Read once at startup; requires a restart to change.
        justiceScanLimit:
          type: number
          description: >-
            Maximum number of channel messages inspected per justice scan.
            Reflects the active ORACLE_JUSTICE_SCAN_LIMIT value (default 100,
            max 500). Read once at startup; requires a restart to change.
      required:
        - status
        - botOnline
        - uptime
        - botReadyAt
        - botUptime
        - shardStatus
        - oracleReplyMode
        - oracleReplyReason
        - alertsConfigured
        - alertThresholdMs
        - justiceWindowMinutes
        - justiceScanLimit

