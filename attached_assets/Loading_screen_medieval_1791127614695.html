<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Se încarcă</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#121212; --card:#1E1E1E; --text:#FFFFFF; --text2:#B0B0B0;
  --red:#D94A2B; --red-d:#B33C24; --muted:#7E7E7E;
  box-sizing:border-box;
}
html,body{height:100%;margin:0}
*,*::before,*::after{box-sizing:border-box}
body{
  background:radial-gradient(ellipse at 50% 42%,#1a1514 0,var(--bg) 62%);
  overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  font-family:"Cinzel","Palatino Linotype",Georgia,serif;color:var(--text2);
}
.stage{width:420px;height:420px;position:relative;transform:scale(var(--k,1));transform-origin:center;flex:none;margin:calc((var(--k,1) - 1) * 210px) 0}
.gate{position:absolute;left:85px;top:60px;width:250px;height:300px}
.gate svg{width:100%;height:100%;display:block;overflow:visible}
.torch{position:absolute;top:168px;width:30px;height:90px}
.torch.l{left:24px}.torch.r{right:24px}
.torch .bracket{position:absolute;left:11px;top:44px;width:8px;height:46px;background:var(--card);border:1px solid #2e2e2e;border-radius:2px}
.torch .bracket::before{content:"";position:absolute;left:-6px;top:-4px;width:18px;height:8px;background:var(--card);border:1px solid #2e2e2e;border-radius:2px}
.flame{position:absolute;left:2px;top:0;width:26px;height:48px;transform-origin:50% 100%;
  border-radius:50% 50% 45% 45% / 70% 70% 30% 30%;
  background:radial-gradient(ellipse at 50% 80%,#ffe2b5 0,#f3894f 35%,var(--red) 65%,var(--red-d) 100%);
  filter:blur(1.2px);animation:flick 1.1s ease-in-out infinite;
  box-shadow:0 0 36px 12px rgba(217,74,43,.38)}
.torch.r .flame{animation-delay:-.5s;animation-duration:.95s}
.flame::after{content:"";position:absolute;left:7px;top:16px;width:12px;height:28px;border-radius:50%;
  background:radial-gradient(ellipse at 50% 80%,#fff3dc,#ffc07f 70%,transparent);opacity:.9}
.embers{position:absolute;inset:0;pointer-events:none}
.ember{position:absolute;bottom:200px;width:3px;height:3px;border-radius:50%;background:#ff9a5c;
  box-shadow:0 0 6px 1px var(--red);opacity:0;animation:up var(--d) ease-out infinite;animation-delay:var(--l)}
.blood{position:relative;width:280px;height:12px;margin:14px 0 40px;flex:none}
.blood .track{position:absolute;inset:0;border-radius:12px;background:var(--card);box-shadow:inset 0 1px 3px rgba(0,0,0,.6)}
.blood .fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:12px;
  background:linear-gradient(180deg,#e0583a 0,var(--red) 35%,var(--red-d) 100%);
  box-shadow:0 0 14px rgba(217,74,43,.55)}
.blood .fill::after{content:"";position:absolute;left:6px;right:6px;top:2px;height:2px;border-radius:2px;background:rgba(255,255,255,.35)}
.drip{position:absolute;top:8px;width:6px;height:0;background:var(--red-d);border-radius:0 0 3px 3px;
  transition:height 1.8s cubic-bezier(.5,0,.9,.6)}
.drip::after{content:"";position:absolute;left:-1px;bottom:-4px;width:8px;height:8px;border-radius:50% 50% 55% 55%;background:var(--red-d);opacity:0;transition:opacity .4s ease 1.2s}
.drip.on{height:var(--h)}
.drip.on::after{opacity:1}
@keyframes flick{
  0%,100%{transform:scale(1,1) skewX(0)}
  20%{transform:scale(.94,1.08) skewX(-3deg)}
  45%{transform:scale(1.05,.93) skewX(2deg)}
  70%{transform:scale(.97,1.06) skewX(-2deg)}
}
@keyframes up{
  0%{transform:translate(0,0) scale(1);opacity:0}
  12%{opacity:1}
  100%{transform:translate(var(--x),-190px) scale(.3);opacity:0}
}
@media (prefers-reduced-motion:reduce){.flame{animation:none}.ember{animation:none;opacity:0}}
</style>
</head>
<body role="progressbar" aria-label="Se încarcă" aria-valuemin="0" aria-valuemax="100">
<div class="stage" id="stage">
  <div class="gate">
    <svg viewBox="0 0 300 360" aria-hidden="true">
      <defs>
        <pattern id="brick" width="50" height="24" patternUnits="userSpaceOnUse">
          <rect width="50" height="24" fill="#1E1E1E"/>
          <path d="M0 .5H50M0 12.5H50M25 .5V12.5M0 12.5V24M50 12.5V24" stroke="#2b2b2b" fill="none"/>
        </pattern>
        <radialGradient id="glow" cx="50%" cy="85%" r="80%">
          <stop offset="0" stop-color="#ffc08a"/><stop offset=".4" stop-color="#D94A2B"/><stop offset="1" stop-color="#2a0e08"/>
        </radialGradient>
        <clipPath id="open"><path d="M70 340V160A80 80 0 0 1 230 160V340Z"/></clipPath>
      </defs>
      <path d="M30 340V150A120 120 0 0 1 270 150V340Z" fill="url(#brick)" stroke="#2e2e2e" stroke-width="2"/>
      <rect x="14" y="340" width="272" height="14" fill="#1E1E1E" stroke="#2e2e2e"/>
      <path d="M138 26H162L158 54H142Z" fill="#262626" stroke="#3a3a3a"/>
      <path d="M70 340V160A80 80 0 0 1 230 160V340Z" fill="#090909"/>
      <g clip-path="url(#open)">
        <rect id="gl" x="70" y="80" width="160" height="262" fill="url(#glow)" opacity="0"/>
        <g id="port" fill="#7E7E7E" stroke="#3a3a3a" stroke-width=".8">
          <rect x="76" y="100" width="148" height="5"/><rect x="76" y="150" width="148" height="5"/>
          <rect x="76" y="200" width="148" height="5"/><rect x="76" y="250" width="148" height="5"/>
          <rect x="76" y="300" width="148" height="5"/>
          <g id="bars"></g>
        </g>
      </g>
      <path d="M70 340V160A80 80 0 0 1 230 160V340" fill="none" stroke="#3a3a3a" stroke-width="2"/>
    </svg>
  </div>
  <div class="torch l"><div class="flame"></div><div class="bracket"></div></div>
  <div class="torch r"><div class="flame"></div><div class="bracket"></div></div>
  <div class="embers" id="embers"></div>
</div>
<div class="blood" aria-hidden="true">
  <div class="track"></div>
  <div class="fill" id="fill"></div>
  <span class="drip" style="left:12%;--h:12px"></span>
  <span class="drip" style="left:27%;--h:24px"></span>
  <span class="drip" style="left:41%;--h:9px"></span>
  <span class="drip" style="left:58%;--h:20px"></span>
  <span class="drip" style="left:73%;--h:14px"></span>
  <span class="drip" style="left:88%;--h:26px"></span>
</div>

<script>
(function(){
  // gratii portcullis
  var NS='http://www.w3.org/2000/svg', bars=document.getElementById('bars');
  for(var x=82;x<=218;x+=17){
    var r=document.createElementNS(NS,'rect');r.setAttribute('x',x-2.5);r.setAttribute('y',84);
    r.setAttribute('width',5);r.setAttribute('height',238);bars.appendChild(r);
    var p=document.createElementNS(NS,'polygon');
    p.setAttribute('points',(x-3.5)+',322 '+(x+3.5)+',322 '+x+',338');bars.appendChild(p);
  }
  // scântei
  var em=document.getElementById('embers');
  for(var i=0;i<22;i++){
    var s=document.createElement('span'),left=i%2?30+Math.random()*30:360+Math.random()*30;
    s.className='ember';s.style.left=left+'px';
    s.style.setProperty('--d',(2.2+Math.random()*2.4)+'s');
    s.style.setProperty('--l',(-Math.random()*4)+'s');
    s.style.setProperty('--x',((Math.random()-.5)*50)+'px');
    em.appendChild(s);
  }
  // scalare pe ecrane înguste
  var stage=document.getElementById('stage');
  function fit(){stage.style.setProperty('--k',Math.min(1,innerWidth/460,innerHeight/560))}
  fit();addEventListener('resize',fit);

  var fill=document.getElementById('fill'), drips=[].slice.call(document.querySelectorAll('.drip'));
  var port=document.getElementById('port'), gl=document.getElementById('gl'),
      LIFT=7000,HOLD=1300,DROP=500,GAP=700,CYCLE=LIFT+HOLD+DROP+GAP,t0=performance.now(),last=-1;
  function easeIO(x){return .5-.5*Math.cos(Math.PI*x)}
  function tick(now){
    var t=(now-t0)%CYCLE,p;
    if(t<LIFT)p=easeIO(t/LIFT);
    else if(t<LIFT+HOLD)p=1;
    else if(t<LIFT+HOLD+DROP){var d=(t-LIFT-HOLD)/DROP;p=1-d*d*d}
    else p=0;
    port.setAttribute('transform','translate(0,'+(-p*270)+')');
    gl.setAttribute('opacity',Math.min(1,p*1.6));
    var n=Math.round(p*100);
    fill.style.width=n+'%';
    if(n!==last){last=n;document.body.setAttribute('aria-valuenow',n);
      drips.forEach(function(d){d.classList.toggle('on',n>parseFloat(d.style.left)+2)})}
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
